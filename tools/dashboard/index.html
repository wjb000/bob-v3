<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Bob v3 Agent Dashboard</title>
    <style>
        body {
            font-family: system-ui;
            max-width: 900px;
            margin: 40px auto;
            background: #111;
            color: #eee;
        }

        button {
            margin: 6px;
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        .status {
            background: #222;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
        }

        textarea {
            width: 100%;
            height: 280px;
            font-family: monospace;
            background: #1a1a1a;
            color: #ddd;
        }

        pre {
            background: #1a1a1a;
            padding: 12px;
            overflow: auto;
            max-height: 220px;
        }
    </style>
</head>

<body>
    <h1>Bob v3 Local Agent Dashboard</h1>
    <div class="status" id="status">Loading...</div>

    <h2>Control</h2>
    <button onclick="act('/stop')">Stop Any Loop</button>
    <button onclick="act('/ollama-restart')">Restart Ollama</button>
    <button onclick="act('/rebuild')">Rebuild CAD + Site</button>
    <button onclick="refresh()">Refresh Status</button>

    <h2>Start Endless Loop (one area)</h2>
    <button onclick="startLoop('docs')">Docs Loop</button>
    <button onclick="startLoop('sim')">Sim Loop</button>
    <button onclick="startLoop('cad')">CAD Loop</button>
    <button onclick="startLoop('site')">Site Loop</button>

    <h2>IMPROVEMENTS.md</h2>
    <textarea id="improvements"></textarea><br>
    <button onclick="saveImprovements()">Save Task List</button>

    <h2>Output</h2>
    <pre id="output"></pre>

    <script>
        async function refresh() {
            const r = await fetch("/status").then(r => r.json());
            document.getElementById("status").innerHTML = `
        <b>Loop:</b> ${r.loop} &nbsp;|&nbsp;
        <b>Ollama:</b> ${r.ollama} &nbsp;|&nbsp;
        <b>Latest:</b> ${r.commit}<br>
        <small>${r.log_tail.replace(/\\n/g, "<br>")}</small>
      `;
        }
        async function act(path) {
            const r = await fetch(path, { method: "POST" }).then(r => r.json());
            document.getElementById("output").textContent = JSON.stringify(r, null, 2);
            refresh();
        }
        async function startLoop(mode) {
            const r = await fetch("/start-loop", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mode })
            }).then(r => r.json());
            document.getElementById("output").textContent = "Started " + mode + " loop\\n" + JSON.stringify(r, null, 2);
            refresh();
        }
        async function saveImprovements() {
            const content = document.getElementById("improvements").value;
            await fetch("/save-improvements", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content })
            });
            alert("Saved");
        }
        async function loadImprovements() {
            const r = await fetch("/improvements").then(r => r.json());
            document.getElementById("improvements").value = r.content || "";
        }
        loadImprovements();
        refresh();
        setInterval(refresh, 10000);
    </script>
</body>

</html>
